# Historical evidence remains readable at its original logical paths in Linux.
# Windows junctions alone cannot cross Docker Desktop's parent bind mount.
x-preserved-evidence:
  consolidation48: &consolidation48
    type: bind
    source: "${FISCAL_EVIDENCE_ROOT:-D:/ProjetoSaasExports/preserved-storage-app}/phase4b-private-consolidation48-draft-20261009-28"
    target: /var/www/html/storage/app/phase4b-private-consolidation48-draft-20261009-28
    read_only: true
    bind:
      create_host_path: false
  expansion47: &expansion47
    type: bind
    source: "${FISCAL_EVIDENCE_ROOT:-D:/ProjetoSaasExports/preserved-storage-app}/phase4b-realization-consolidated-expansion47-draft-20261009-28"
    target: /var/www/html/storage/app/phase4b-realization-consolidated-expansion47-draft-20261009-28
    read_only: true
    bind:
      create_host_path: false
  thirdSale: &thirdSale
    type: bind
    source: "${FISCAL_EVIDENCE_ROOT:-D:/ProjetoSaasExports/preserved-storage-app}/phase4b-realization-third-sale-integrated-draft-20261008-28"
    target: /var/www/html/storage/app/phase4b-realization-third-sale-integrated-draft-20261008-28
    read_only: true
    bind:
      create_host_path: false
  signedRelease: &signedRelease
    type: bind
    source: "${FISCAL_EVIDENCE_ROOT:-D:/ProjetoSaasExports/preserved-storage-app}/phase4b-realization-public-signed-release-draft-20261008-28"
    target: /var/www/html/storage/app/phase4b-realization-public-signed-release-draft-20261008-28
    read_only: true
    bind:
      create_host_path: false

services:
  app:
    build:
      context: .
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: fiscal_engine
      DB_USERNAME: fiscal_engine
      DB_PASSWORD: fiscal_engine_local
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - *consolidation48
      - *expansion47
      - *thirdSale
      - *signedRelease
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - *consolidation48
      - *expansion47
      - *thirdSale
      - *signedRelease
    depends_on:
      - app

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: fiscal_engine
      POSTGRES_USER: fiscal_engine
      POSTGRES_PASSWORD: fiscal_engine_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fiscal_engine -d fiscal_engine"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  vendor_data:
